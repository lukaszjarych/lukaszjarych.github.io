<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF5EA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#2F855A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#8AA1B4" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 44px "Segoe UI", Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 22px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #0F172A; letter-spacing: 0.04em; }
      .label { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0F172A; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .small { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #0F172A; }
      .tiny { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .pill { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #0F4C81; }
      .arrow { stroke: #0F4C81; stroke-width: 4; stroke-linecap: round; }
      .dashed { stroke: #5B6B7D; stroke-width: 3; stroke-dasharray: 10 10; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>

  <rect x="56" y="48" width="1488" height="172" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="92" y="84" width="182" height="42" rx="21" fill="#DCEBFF"/>
  <text x="183" y="111" text-anchor="middle" class="pill">CASE STUDY</text>
  <text x="92" y="164" class="title">Cloud Migration Metadata Workflow</text>
  <text x="92" y="199" class="subtitle">Excel-first reporting workflow built with Power Query, bundle-fed SQL logic, and curated CSV inputs</text>

  <text x="92" y="278" class="section">PRIMARY WORKFLOW</text>

  <g filter="url(#shadow)">
    <rect x="92" y="312" width="260" height="224" rx="26" fill="#FFFFFF"/>
    <rect x="118" y="338" width="206" height="14" rx="7" fill="#DCEBFF"/>
    <rect x="118" y="366" width="128" height="14" rx="7" fill="#DCEBFF"/>
    <text x="118" y="410" class="label">Bundle Inputs</text>
    <text x="118" y="447" class="body">Metadata bundles</text>
    <text x="118" y="476" class="body">SQL definitions</text>
    <text x="118" y="505" class="body">Curated CSV structures</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="402" y="312" width="260" height="224" rx="26" fill="#FFFFFF"/>
    <rect x="428" y="338" width="206" height="14" rx="7" fill="#E1F3E7"/>
    <rect x="428" y="366" width="144" height="14" rx="7" fill="#E1F3E7"/>
    <text x="428" y="410" class="label">Power Query</text>
    <text x="428" y="447" class="body">Data standardization</text>
    <text x="428" y="476" class="body">Transformation logic</text>
    <text x="428" y="505" class="body">Workbook-ready tables</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="712" y="312" width="260" height="224" rx="26" fill="#FFFFFF"/>
    <rect x="738" y="338" width="206" height="14" rx="7" fill="#DCEBFF"/>
    <rect x="738" y="366" width="136" height="14" rx="7" fill="#DCEBFF"/>
    <text x="738" y="410" class="label">Excel Blueprint</text>
    <text x="738" y="447" class="body">Controlled inputs</text>
    <text x="738" y="476" class="body">Selection and workbook logic</text>
    <text x="738" y="505" class="body">Computed infrastructure outputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1022" y="312" width="486" height="224" rx="26" fill="url(#accent)"/>
    <rect x="1050" y="340" width="136" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="1073" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">DELIVERY</text>
    <text x="1050" y="413" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Migration Reporting Output</text>
    <text x="1050" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#EAF5EF">Ready-to-use reporting for servers, storage, and topology planning</text>
    <text x="1050" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#EAF5EF">Repeatable Excel deliverables generated from structured metadata</text>
  </g>

  <path d="M352 424H402" class="arrow"/>
  <path d="M385 409L402 424L385 439" class="arrow"/>
  <path d="M662 424H712" class="arrow"/>
  <path d="M695 409L712 424L695 439" class="arrow"/>
  <path d="M972 424H1022" class="arrow"/>
  <path d="M1005 409L1022 424L1005 439" class="arrow"/>

  <text x="92" y="606" class="section">LATER EVOLUTION</text>

  <g filter="url(#shadow)">
    <rect x="92" y="636" width="1416" height="192" rx="30" fill="#FFFFFF"/>
    <rect x="124" y="674" width="524" height="118" rx="22" fill="#F8FBFF"/>
    <text x="152" y="711" class="small">What changed later</text>
    <text x="152" y="741" class="tiny">After the Excel + Power Query phase, reporting moved toward Java-based</text>
    <text x="152" y="765" class="tiny">delivery using CSV inputs and joins implemented in Java.</text>

    <rect x="694" y="674" width="396" height="118" rx="22" fill="#F7FCF8"/>
    <text x="722" y="711" class="small">Why it mattered</text>
    <text x="722" y="741" class="tiny">It separated report delivery automation from</text>
    <text x="722" y="765" class="tiny">the original Excel-first workflow.</text>

    <rect x="1136" y="674" width="340" height="118" rx="22" fill="#F8FBFF"/>
    <text x="1164" y="711" class="small">Portfolio framing</text>
    <text x="1164" y="741" class="tiny">Primary expertise: robust Excel workflow.</text>
    <text x="1164" y="765" class="tiny">Secondary evolution: Java reporting delivery.</text>
  </g>

  <path d="M840 536V612" class="dashed"/>
</svg>
