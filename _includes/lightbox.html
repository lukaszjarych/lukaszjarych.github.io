<dialog class="lightbox" id="image-lightbox" aria-label="Expanded image view">
  <form method="dialog" class="lightbox__close-wrap">
    <button class="lightbox__close" aria-label="Close image preview">Close</button>
  </form>
  <figure class="lightbox__figure">
    <img id="lightbox-image" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
</dialog>
