---
layout: default
---

<section class="page-hero{% if page.hero_style == 'compact' %} page-hero--compact{% endif %}">
  <div class="container">
    <p class="eyebrow">Portfolio</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}
      <p class="lead">{{ page.intro }}</p>
    {% endif %}
  </div>
</section>

<section class="page-section{% if page.hero_style == 'compact' %} page-section--after-compact-hero{% endif %}">
  <div class="container prose">
    {{ content }}
  </div>
</section>
