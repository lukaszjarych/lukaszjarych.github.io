---
layout: default
---

<article class="case-study">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">{{ page.eyebrow }}</p>
      <h1>{{ page.title }}</h1>
      <p class="lead">{{ page.summary }}</p>
      <div class="tag-list">
        {% for tool in page.tools %}
          <span class="tag">{{ tool }}</span>
        {% endfor %}
      </div>
    </div>
  </section>

  <section class="page-section">
    <div class="container case-study__content">
      <div class="prose">
        {{ content }}
      </div>

      {% if page.gallery %}
        <aside class="case-study__gallery">
          <p class="eyebrow">Selected Visuals</p>
          {% for image in page.gallery %}
            <figure class="figure">
              <img src="{{ image.path | relative_url }}" alt="{{ image.alt }}">
              <figcaption>{{ image.caption }}</figcaption>
            </figure>
          {% endfor %}
        </aside>
      {% endif %}
    </div>
  </section>
</article>
